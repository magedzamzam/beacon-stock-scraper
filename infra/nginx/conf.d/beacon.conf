# ---- Beacon Screener site ----
# HTTP only by default. To enable HTTPS, generate certs into ./infra/nginx/certs/
# and uncomment the 443 server block below.

upstream beacon_api      { server api:8000; }
upstream beacon_frontend { server frontend:3000; }

# Trust X-Forwarded-* headers from the OCI LB only.
# Replace the CIDR with your actual LB subnet (Networking → VCN → Subnets).
set_real_ip_from 10.0.0.0/8;     # or the specific LB subnet, e.g. 10.0.1.0/24
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    # Accept any Host header (the LB rewrites it; locking it down isn't useful here).
    server_name _;
    client_max_body_size 4m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Was: X-Frame-Options "SAMEORIGIN" — keep, but drop X-XSS-Protection (deprecated).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tell browsers your origin is HTTPS even though this server speaks HTTP — the
    # LB is the HTTPS endpoint. 6 months is conservative; bump after you're confident.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    location /api/ {
        set $api_upstream "http://api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # IMPORTANT: trust the LB's scheme. Without this, FastAPI thinks the
        # request was HTTP and will issue insecure redirects.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /_next/static/ {
        set $front_upstream "http://frontend:3000";
        proxy_pass $front_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $front_upstream "http://frontend:3000";
        proxy_pass $front_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}