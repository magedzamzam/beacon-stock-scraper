name: beacon-screener

x-python-env: &python-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
  TZ: ${TZ:-Asia/Dubai}
  PYTHONUNBUFFERED: "1"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: beacon-api:latest
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      <<: *python-env
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      SCRAPER_URL: http://scraper:8001
      RECOMMENDER_URL: http://recommender:8002
    networks: [beacon-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    image: beacon-scraper:latest
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      <<: *python-env
      SCRAPER_BASE_URL: ${SCRAPER_BASE_URL}
      SCRAPER_DELAY_SEC: ${SCRAPER_DELAY_SEC}
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
    networks: [beacon-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommender:
    build:
      context: .
      dockerfile: services/recommender/Dockerfile
    image: beacon-recommender:latest
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      <<: *python-env
    networks: [beacon-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    image: beacon-scheduler:latest
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      <<: *python-env
      DAILY_SCRAPE_CRON: ${DAILY_SCRAPE_CRON}
      SCRAPER_URL: http://scraper:8001
      RECOMMENDER_URL: http://recommender:8002
    depends_on:
      scraper:
        condition: service_healthy
      recommender:
        condition: service_healthy
    networks: [beacon-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: beacon-frontend:latest
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    ports: 
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: /api
      TZ: ${TZ:-Asia/Dubai}
    networks: [beacon-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    dns: [1.1.1.1, 8.8.8.8]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [beacon-net]

networks:
  beacon-net:
    driver: bridge
